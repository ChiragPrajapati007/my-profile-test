<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chirag Prajapati — IT Engineer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
      font-family: Inter, Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }

    .fallback {
      display: none;
      color: white;
      padding: 30px;
    }

    @media (max-width: 700px) {
      html, body {
        overflow: auto;
      }

      canvas {
        min-height: 100vh;
      }
    }
  </style>
</head>

<body>

<canvas id="portfolio"></canvas>

<script>
const canvas = document.getElementById("portfolio");
const ctx = canvas.getContext("2d");

let W, H, DPR;
let mouse = { x: -100, y: -100 };
let scroll = 0;

const sections = [
  { id: "home", label: "HOME" },
  { id: "about", label: "ABOUT" },
  { id: "work", label: "WORK" },
  { id: "skills", label: "SKILLS" },
  { id: "contact", label: "CONTACT" }
];

const projects = [
  {
    title: "ReconcileAI",
    type: "AI / FULL-STACK",
    description:
      "An auditable purchase-order and invoice reconciliation system combining multimodal extraction with deterministic financial reconciliation.",
    tags: ["FastAPI", "Next.js", "Gemini", "PostgreSQL"]
  },
  {
    title: "OneAI Studio",
    type: "AI PLATFORM",
    description:
      "A structured AI workspace concept focused on practical LLM workflows, tool calling and intelligent automation.",
    tags: ["LLM", "APIs", "Agents", "Automation"]
  },
  {
    title: "ACM SIGITE",
    type: "CREATIVE / TECH COMMUNITY",
    description:
      "Creative leadership and digital design work for the TCET ACM SIGITE Student Chapter.",
    tags: ["Design", "Branding", "Content", "Leadership"]
  }
];

const skills = [
  ["HTML / CSS", 0.90],
  ["JavaScript", 0.65],
  ["C++", 0.65],
  ["Python", 0.55],
  ["FastAPI", 0.65],
  ["Next.js", 0.60],
  ["PostgreSQL", 0.55],
  ["Git / GitHub", 0.65],
  ["Docker", 0.55],
  ["AI / LLM APIs", 0.60]
];

const particles = [];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resize);
resize();

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.5 + 0.3,
    speed: Math.random() * 0.0004 + 0.0001
  });
}

canvas.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener("click", e => {
  const x = e.clientX;
  const y = e.clientY;

  // Navigation
  if (y < 90) {
    const navWidth = Math.min(700, W * 0.65);
    const startX = W - navWidth - 50;

    sections.forEach((section, i) => {
      const sx = startX + i * (navWidth / sections.length);

      if (x > sx - 10 && x < sx + navWidth / sections.length) {
        scrollToSection(i);
      }
    });
  }

  // Project buttons
  if (currentSection === 2 && y > 330 && y < 650) {
    // Placeholder interaction
  }
});

let currentSection = 0;

function scrollToSection(index) {
  currentSection = index;
  animateTransition();
}

let transition = 1;
let transitionTarget = 1;

function animateTransition() {
  transition = 0;
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function text(txt, x, y, size, color, weight = "400", align = "left") {
  ctx.font = `${weight} ${size}px Inter, Arial, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillText(txt, x, y);
}

function line(x1, y1, x2, y2, color, width = 1) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function wrapText(txt, x, y, maxWidth, lineHeight, color, size = 17) {
  ctx.font = `400 ${size}px Inter, Arial, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";

  const words = txt.split(" ");
  let lineText = "";
  let yy = y;

  for (let n = 0; n < words.length; n++) {
    const test = lineText + words[n] + " ";
    const width = ctx.measureText(test).width;

    if (width > maxWidth && n > 0) {
      ctx.fillText(lineText, x, yy);
      lineText = words[n] + " ";
      yy += lineHeight;
    } else {
      lineText = test;
    }
  }

  ctx.fillText(lineText, x, yy);
  return yy + lineHeight;
}

function drawBackground() {
  ctx.fillStyle = "#070b14";
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = "rgba(148,163,184,0.045)";
  ctx.lineWidth = 1;

  const grid = 50;

  for (let x = 0; x < W; x += grid) {
    line(x, 0, x, H, "rgba(148,163,184,0.045)");
  }

  for (let y = 0; y < H; y += grid) {
    line(0, y, W, y, "rgba(148,163,184,0.045)");
  }

  // Ambient blue glow
  const glow = ctx.createRadialGradient(
    W * 0.72,
    H * 0.25,
    0,
    W * 0.72,
    H * 0.25,
    Math.min(W, H) * 0.65
  );

  glow.addColorStop(0, "rgba(59,130,246,0.12)");
  glow.addColorStop(1, "rgba(59,130,246,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Particles
  particles.forEach(p => {
    p.y -= p.speed;

    if (p.y < 0) p.y = 1;

    ctx.beginPath();
    ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(148,163,184,0.25)";
    ctx.fill();
  });
}

function drawHeader() {
  text("CP", 50, 45, 22, "#f8fafc", "700");

  line(50, 66, 88, 66, "#3b82f6", 2);

  const navWidth = Math.min(700, W * 0.65);
  const startX = W - navWidth - 50;

  sections.forEach((section, i) => {
    const x = startX + i * (navWidth / sections.length);

    text(
      section.label,
      x,
      45,
      11,
      currentSection === i ? "#60a5fa" : "#64748b",
      "600"
    );

    if (currentSection === i) {
      line(x, 63, x + 30, 63, "#3b82f6", 2);
    }
  });

  line(50, 82, W - 50, 82, "rgba(148,163,184,0.12)");
}

function drawHome() {
  const left = Math.max(55, W * 0.10);
  const top = H * 0.22;

  text("INFORMATION TECHNOLOGY ENGINEER", left, top, 12, "#60a5fa", "600");

  text(
    "CHIRAG",
    left,
    top + 70,
    Math.min(90, W * 0.085),
    "#f8fafc",
    "800"
  );

  text(
    "PRAJAPATI",
    left,
    top + 150,
    Math.min(90, W * 0.085),
    "#64748b",
    "800"
  );

  line(left, top + 190, left + 75, top + 190, "#3b82f6", 4);

  wrapText(
    "Building practical software at the intersection of engineering, AI and cloud technologies.",
    left,
    top + 225,
    Math.min(600, W * 0.48),
    28,
    "#cbd5e1",
    18
  );

  // Right side identity panel
  const cardW = Math.min(360, W * 0.32);
  const cardH = 330;
  const cardX = W - cardW - Math.max(55, W * 0.10);
  const cardY = H * 0.25;

  ctx.fillStyle = "rgba(15,23,42,0.55)";
  roundedRect(cardX, cardY, cardW, cardH, 16);
  ctx.fill();

  ctx.strokeStyle = "rgba(96,165,250,0.20)";
  ctx.stroke();

  text("PROFILE / 2026", cardX + 30, cardY + 35, 11, "#64748b", "600");

  text("IT", cardX + 30, cardY + 100, 72, "#f8fafc", "800");

  text("ENGINEERING", cardX + 32, cardY + 145, 13, "#60a5fa", "600");

  line(cardX + 30, cardY + 175, cardX + cardW - 30, cardY + 175,
       "rgba(148,163,184,0.15)");

  const details = [
    ["ROLE", "Student Engineer"],
    ["FOCUS", "Backend / Cloud / AI"],
    ["COMMUNITY", "ACM SIGITE"],
    ["LOCATION", "Mumbai, India"]
  ];

  details.forEach((d, i) => {
    text(d[0], cardX + 30, cardY + 205 + i * 27, 9, "#64748b", "600");
    text(d[1], cardX + 125, cardY + 205 + i * 27, 11, "#cbd5e1", "500");
  });

  text(
    "SCROLL / NAVIGATE",
    left,
    H - 55,
    10,
    "#475569",
    "600"
  );
}

function drawAbout() {
  const x = Math.max(55, W * 0.10);
  const y = 145;

  text("01 / ABOUT", x, y, 11, "#60a5fa", "600");

  text(
    "Engineering with a bias",
    x,
    y + 70,
    Math.min(54, W * 0.055),
    "#f8fafc",
    "700"
  );

  text(
    "toward building.",
    x,
    y + 130,
    Math.min(54, W * 0.055),
    "#64748b",
    "700"
  );

  wrapText(
    "I am an Information Technology engineering student focused on becoming a strong software engineer. My current direction combines backend development, cloud infrastructure, DevOps and practical AI systems.",
    x,
    y + 190,
    Math.min(650, W * 0.55),
    27,
    "#cbd5e1",
    17
  );

  const statsX = W * 0.68;
  const stats = [
    ["01", "ENGINEERING"],
    ["02", "AI SYSTEMS"],
    ["03", "CLOUD / DEVOPS"],
    ["04", "CREATIVE LEADERSHIP"]
  ];

  stats.forEach((s, i) => {
    const yy = y + i * 70;

    text(s[0], statsX, yy, 12, "#3b82f6", "700");
    text(s[1], statsX + 45, yy, 13, "#cbd5e1", "600");

    line(
      statsX,
      yy + 22,
      Math.min(W - 70, statsX + 300),
      yy + 22,
      "rgba(148,163,184,0.12)"
    );
  });
}

function drawWork() {
  const x = Math.max(45, W * 0.07);
  const y = 120;

  text("02 / SELECTED WORK", x, y, 11, "#60a5fa", "600");

  const available = W - x * 2;
  const gap = 20;
  const cardW = (available - gap * 2) / 3;
  const cardY = y + 55;
  const cardH = Math.min(440, H - cardY - 100);

  projects.forEach((project, i) => {
    const cx = x + i * (cardW + gap);

    ctx.fillStyle = "rgba(15,23,42,0.62)";
    roundedRect(cx, cardY, cardW, cardH, 14);
    ctx.fill();

    ctx.strokeStyle = "rgba(148,163,184,0.12)";
    ctx.stroke();

    // Project number
    text(
      `0${i + 1}`,
      cx + 25,
      cardY + 35,
      11,
      "#3b82f6",
      "700"
    );

    text(
      project.type,
      cx + 25,
      cardY + 75,
      9,
      "#64748b",
      "600"
    );

    text(
      project.title,
      cx + 25,
      cardY + 115,
      Math.min(25, cardW * 0.09),
      "#f8fafc",
      "700"
    );

    wrapText(
      project.description,
      cx + 25,
      cardY + 150,
      cardW - 50,
      22,
      "#94a3b8",
      13
    );

    project.tags.forEach((tag, j) => {
      const tx = cx + 25 + (j % 2) * ((cardW - 60) / 2);
      const ty = cardY + cardH - 80 + Math.floor(j / 2) * 25;

      text(tag, tx, ty, 9, "#64748b", "500");
    });

    line(
      cx + 25,
      cardY + cardH - 40,
      cx + cardW - 25,
      cardY + cardH - 40,
      "rgba(148,163,184,0.12)"
    );

    text(
      "VIEW CASE →",
      cx + 25,
      cardY + cardH - 18,
      9,
      "#60a5fa",
      "600"
    );
  });
}

function drawSkills() {
  const x = Math.max(55, W * 0.10);
  const y = 120;

  text("03 / TECHNICAL STACK", x, y, 11, "#60a5fa", "600");

  text(
    "Tools I build with.",
    x,
    y + 70,
    Math.min(55, W * 0.055),
    "#f8fafc",
    "700"
  );

  const startY = y + 140;
  const colW = Math.min(450, W * 0.37);

  skills.forEach((skill, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);

    const sx = x + col * (colW + 70);
    const sy = startY + row * 55;

    text(skill[0], sx, sy, 12, "#cbd5e1", "600");

    const barX = sx;
    const barY = sy + 18;
    const barW = colW;
    const barH = 3;

    ctx.fillStyle = "rgba(148,163,184,0.12)";
    ctx.fillRect(barX, barY, barW, barH);

    ctx.fillStyle = "#3b82f6";
    ctx.fillRect(barX, barY, barW * skill[1], barH);
  });

  text(
    "CURRENT DIRECTION",
    W * 0.72,
    H * 0.30,
    10,
    "#64748b",
    "600"
  );

  text(
    "BACKEND",
    W * 0.72,
    H * 0.38,
    20,
    "#f8fafc",
    "700"
  );

  text(
    "CLOUD",
    W * 0.72,
    H * 0.44,
    20,
    "#f8fafc",
    "700"
  );

  text(
    "DEVOPS",
    W * 0.72,
    H * 0.50,
    20,
    "#f8fafc",
    "700"
  );

  text(
    "AI SYSTEMS",
    W * 0.72,
    H * 0.56,
    20,
    "#60a5fa",
    "700"
  );
}

function drawContact() {
  const x = Math.max(55, W * 0.10);
  const y = H * 0.23;

  text("04 / CONTACT", x, y, 11, "#60a5fa", "600");

  text(
    "Let's build something",
    x,
    y + 75,
    Math.min(60, W * 0.06),
    "#f8fafc",
    "700"
  );

  text(
    "useful.",
    x,
    y + 140,
    Math.min(60, W * 0.06),
    "#64748b",
    "700"
  );

  text(
    "OPEN TO INTERNSHIPS • COLLABORATIONS • TECH PROJECTS",
    x,
    y + 210,
    11,
    "#94a3b8",
    "600"
  );

  const linksX = W * 0.62;

  const links = [
    ["GITHUB", "github.com/ChiragPrajapati007"],
    ["LINKEDIN", "linkedin.com/in/chirag-prajapati"],
    ["EMAIL", "Available on request"]
  ];

  links.forEach((item, i) => {
    const yy = y + i * 65;

    text(item[0], linksX, yy, 10, "#3b82f6", "700");
    text(item[1], linksX, yy + 25, 13, "#cbd5e1", "500");

    line(
      linksX,
      yy + 43,
      Math.min(W - 60, linksX + 300),
      yy + 43,
      "rgba(148,163,184,0.15)"
    );
  });

  text(
    "CHIRAG PRAJAPATI / 2026",
    x,
    H - 55,
    10,
    "#475569",
    "600"
  );
}

function drawTransition() {
  if (transition < 1) {
    transition += 0.06;

    ctx.fillStyle = `rgba(7,11,20,${1 - transition})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function render() {
  drawBackground();
  drawHeader();

  switch (currentSection) {
    case 0:
      drawHome();
      break;

    case 1:
      drawAbout();
      break;

    case 2:
      drawWork();
      break;

    case 3:
      drawSkills();
      break;

    case 4:
      drawContact();
      break;
  }

  drawTransition();

  requestAnimationFrame(render);
}

render();

// Keyboard navigation
window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") {
    currentSection = Math.min(4, currentSection + 1);
    animateTransition();
  }

  if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
    currentSection = Math.max(0, currentSection - 1);
    animateTransition();
  }

  if (e.key >= "1" && e.key <= "5") {
    currentSection = Number(e.key) - 1;
    animateTransition();
  }
});
</script>

</body>
</html>
